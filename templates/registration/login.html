{% extends "base.html" %}
{% block title %}Вхід · Звітник{% endblock %}
{% block content %}
  <h1>Вхід для оператора</h1>
  {% if form.errors %}<p class="error">Невірний логін або пароль.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Логін<br><input name="username" autofocus required></label></p>
    <p><label>Пароль<br><input name="password" type="password" required></label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Увійти</button>
  </form>
{% endblock %}
